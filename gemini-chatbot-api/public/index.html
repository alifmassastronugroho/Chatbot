<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" id="meta-theme-color" />
  <title>FitBot - Asisten Olahraga Pribadi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="mobile-frame">

    <header class="status-bar" aria-hidden="true">
      <div class="status-time" id="status-time">9:41</div>
      <div class="status-notch"></div>
      <div class="status-icons">

        <svg class="status-icon" viewBox="0 0 18 12" fill="currentColor">
          <rect x="0" y="9" width="3" height="3" rx="0.8"/>
          <rect x="5" y="6" width="3" height="6" rx="0.8"/>
          <rect x="10" y="3" width="3" height="9" rx="0.8"/>
          <rect x="15" y="0" width="3" height="12" rx="0.8"/>
        </svg>
     
        <svg class="status-icon" viewBox="0 0 16 12" fill="currentColor">
          <path d="M8 9.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm-4.24-3.53a6 6 0 0 1 8.48 0 .8.8 0 0 1-1.13 1.13 4.4 4.4 0 0 0-6.22 0 .8.8 0 0 1-1.13-1.13zm-2.83-2.83a10 10 0 0 1 14.14 0 .8.8 0 0 1-1.13 1.13 8.4 8.4 0 0 0-11.88 0 .8.8 0 0 1-1.13-1.13z"/>
        </svg>

        <svg class="status-icon battery-icon" viewBox="0 0 24 12" fill="currentColor">
          <rect x="1" y="1" width="20" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <rect x="3" y="3" width="13" height="6" rx="1.5" fill="currentColor"/>
          <path d="M22 4.5v3a1.5 1.5 0 0 0 1.5-1.5 1.5 1.5 0 0 0-1.5-1.5z"/>
        </svg>
      </div>
    </header>

 
    <nav class="app-header">
      <button type="button" class="icon-btn back-btn" id="btn-back" title="Atur ulang chat" aria-label="Atur ulang percakapan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>

      <div class="bot-profile">
        <div class="bot-avatar-header">
          <svg viewBox="0 0 36 36" fill="none" class="bot-avatar-svg">
            <path d="M18 5V9" stroke="#007aff" stroke-width="2" stroke-linecap="round"/>
            <circle cx="18" cy="4" r="2" fill="#007aff"/>
            <rect x="7" y="9" width="22" height="18" rx="7" fill="#e1f0ff" stroke="#007aff" stroke-width="2"/>
            <rect x="4" y="15" width="3" height="6" rx="1.5" fill="#007aff"/>
            <rect x="29" y="15" width="3" height="6" rx="1.5" fill="#007aff"/>
            <circle cx="13.5" cy="16.5" r="2.2" fill="#007aff"/>
            <circle cx="22.5" cy="16.5" r="2.2" fill="#007aff"/>
            <path d="M14 22H22" stroke="#007aff" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="bot-meta">
          <h1 class="bot-name">FitBot</h1>
          <div class="bot-status">
            <span class="status-dot"></span>
            <span class="status-label">Selalu aktif</span>
          </div>
        </div>
      </div>

      <div class="header-actions">

        <button type="button" class="theme-toggle-btn" id="theme-toggle" title="Ganti mode gelap" aria-label="Ganti mode gelap">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <div class="menu-container">
          <button type="button" class="icon-btn more-btn" id="btn-more" title="Opsi lainnya" aria-label="Opsi lainnya" aria-haspopup="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <circle cx="5" cy="12" r="2"/>
              <circle cx="12" cy="12" r="2"/>
              <circle cx="19" cy="12" r="2"/>
            </svg>
          </button>

          <div class="dropdown-menu hidden" id="dropdown-menu">
            <button type="button" class="menu-item" id="menu-reset">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="1 4 1 10 7 10"></polyline>
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
              </svg>
              <span>Hapus percakapan</span>
            </button>
            <button type="button" class="menu-item" id="menu-location">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
              <span id="location-status-text">Lokasi: Jakarta (bawaan)</span>
            </button>
            <button type="button" class="menu-item" id="menu-theme">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>
              </svg>
              <span id="menu-theme-text">Mode gelap: Mati</span>
            </button>
          </div>
        </div>
      </div>
    </nav>

    <main class="chat-area" id="chat-box" aria-live="polite">
    </main>

    <div class="quick-replies-tray" id="quick-replies-tray"></div>

    <footer class="input-container">
      <input type="file" id="attachment-input" class="visually-hidden" multiple aria-label="Pilih lampiran" />
      <div id="attachment-preview-list" class="attachment-preview-list" aria-live="polite"></div>
      <form id="chat-form" class="chat-form">
        <div class="input-pill">
          <button type="button" class="attach-btn" id="attach-btn" title="Lampirkan file" aria-label="Lampirkan file">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.82-2.83l8.48-8.48"></path>
            </svg>
          </button>
          <input 
            type="text" 
            id="user-input" 
            placeholder="Ketik pesan..." 
            autocomplete="off" 
            aria-label="Ketik pesan Anda"
          />
          <button type="button" class="mic-btn" id="mic-btn" title="Masukan suara" aria-label="Gunakan mikrofon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>
        </div>

        <button type="submit" class="send-btn" id="send-btn" title="Kirim pesan" aria-label="Kirim pesan">

          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M3.4 20.4l17.45-7.48a1 1 0 0 0 0-1.84L3.4 3.6a.993.993 0 0 0-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"/>
          </svg>
        </button>
      </form>


      <div class="home-indicator" aria-hidden="true"></div>
    </footer>
  </div>

  <div class="modal-overlay hidden" id="booking-modal">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h3 id="modal-title">Pesan kunjungan</h3>
        <button type="button" class="modal-close" id="modal-close">&times;</button>
      </div>
      <form id="booking-form" class="booking-form">
        <input type="hidden" id="modal-facility-id" />
        <div class="form-group">
          <label for="booking-facility-name">Fasilitas</label>
          <input type="text" id="booking-facility-name" readonly />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="booking-date">Tanggal</label>
            <input type="date" id="booking-date" required />
          </div>
          <div class="form-group">
            <label for="booking-time">Waktu</label>
            <input type="time" id="booking-time" required value="09:00" />
          </div>
        </div>
        <button type="submit" class="modal-submit-btn">Konfirmasi pemesanan</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
